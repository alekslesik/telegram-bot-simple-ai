
services:
  bot:
    image: ghcr.io/alekslesik/telegram-bot-simple-ai:${IMAGE_TAG:-latest}
    env_file:
      - .env
    restart: unless-stopped
  ingest:
    image: ghcr.io/alekslesik/telegram-bot-simple-ai:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    env_file:
      - .env
    command: ["/app/ingest", "-root", "/app/content/raw"]
    volumes:
      - ./content/raw:/app/content/raw:ro
    restart: "no"
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: telegram_bot_simple_ai
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot

