services:
  bot:
    image: ${APP_IMAGE:-telegram-bot-simple}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
  ingest:
    image: ${APP_IMAGE:-telegram-bot-simple}
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    env_file:
      - .env
    command: ["/app/ingest", "-root", "/app/content/raw", "-write"]
    volumes:
      - ./content/raw:/app/content/raw:ro
    restart: "no"
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: telegram_bot_simple_ai
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    ports:
      - "5432:5432"
